<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Paper Scissor</h1>
    <div class="choices" >
        <div class="choice" id="rock"><img src="https://images.unsplash.com/photo-1604919520235-d601085fdff3?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDV8fHxlbnwwfHx8fHw%3D" alt=""></div>
        <div class="choice" id="paper"><img src="https://images.unsplash.com/photo-1580836618305-605c32623ae0?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDIwNXx8fGVufDB8fHx8fA%3D%3D" alt=""></div>
        <div class="choice" id="scissor"><img src="https://images.unsplash.com/photo-1650106348070-51f5d680a597?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDEwfHx8ZW58MHx8fHx8" alt=""></div>
    </div>

    <div class="score-board">
        <div class="score" >
            <p id="user-score">0</p>
            <p>you</p>
        </div>
        <div class="score" >
            <p id="comp-score">0</p>
            <p>Comp</p>
        </div>
    </div>

    <div class="msg-container">
        <p id="msg">Play game</p>
    </div>
</body>
<script src="script.js"></script>
</html>
